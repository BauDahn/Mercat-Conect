[project]
name = "mercat-conect-api"
version = "0.1.0"
description = "Backend FastAPI de Mercat-Conect"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.137",
  "uvicorn[standard]>=0.32,<0.40",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<1.18",
  "psycopg[binary]>=3.2,<3.4",
  "pydantic-settings>=2.6,<2.12",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<0.29",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.120,<7",
  "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
