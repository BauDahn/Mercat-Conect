name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas y lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
      - name: Dependencias
        run: uv sync --locked --project apps/api
      - name: Lint
        run: uvx ruff@0.6.9 check apps/api
      - name: Pruebas
        run: uv run --project apps/api pytest -q

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  compose:
    name: Compose (validación de configuración)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml con la plantilla de entorno
        run: |
          cp .env.example .env
          docker compose config --quiet
